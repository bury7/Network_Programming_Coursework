[project]
authors     = [{name = "Artem Nizhyvenko", email = "artem_nizhyvenko@proton.me"}]
description = "Network programming coursework: Flask web server with Basic Auth and a REST API"
name        = "Network_Programming_Coursework"
readme      = "README.md"
version     = "0.1.0"

dependencies    = [
  "flask>=3.1.3",
  "gunicorn>=27.0.1",
  "requests>=2.34.2",
]
requires-python = ">=3.15"

[dependency-groups]
dev = [
  "pytest>=9.2.0",
  "ruff>=0.17.6",
  "ty>=0.0.110",
]

[project.urls]
repository = "https://github.com/bury7/Network_Programming_Coursework"

[build-system]
build-backend = "uv_build"
requires      = ["uv_build>=0.13,<0.14"]

[tool.uv]
required-version = ">=0.9"

[tool.uv.build-backend]
module-name = "coursework"

[tool.ruff]
exclude = [
  "*.ipynb",
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".github",
  ".hg",
  ".idea",
  ".ipynb_checkpoints",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pyenv",
  ".pytest_cache",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  ".vscode",
  "__pycache__",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "env_files",
  "node_modules",
  "site-packages",
  "tmp",
  "venv",
]

indent-width = 4
line-length  = 119

target-version = "py315"

[tool.ruff.lint]
ignore = ["C901", "COM812", "CPY", "D", "DOC", "PLR0912", "PLR0915", "T201"]
select = ["ALL"]

fixable   = ["ALL"]
unfixable = []

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.format]
docstring-code-format     = false
indent-style              = "space"
line-ending               = "auto"
quote-style               = "double"
skip-magic-trailing-comma = false

[tool.ty.environment]
python-version = "3.15"

[tool.ty.terminal]
error-on-warning = true

[tool.pytest]
addopts   = ["--strict-markers"]
testpaths = ["tests"]
